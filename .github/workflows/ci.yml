name: Continuous Integration (CI) - Hardened & Secure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 🔒 Permissões mínimas (Princípio do Menor Privilégio)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 🔍 Qualidade, Linters & Testes Automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Seguro do Código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Go com Cache Nativo
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 🧹 Verificação de Qualidade e Sintaxe (Vet)
        run: go vet ./...

      - name: 🧪 Execução de Testes Automatizados (Fail Fast)
        run: go test -v ./...